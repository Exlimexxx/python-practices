{% extends "base.html" %}
{% block title %}Жанры{% endblock %}
{% block content %}
<h2>Жанры фильмов</h2>
<table>
    <tr><th>Жанр</th><th>Слаг</th><th>Фильмов</th><th>Описание</th></tr>
    {% for g in genres %}
        <tr>
            <td><a href="{{ g.get_absolute_url }}">{{ g.name }}</a></td>
            <td>{{ g.slug }}</td>
            <td>{{ g.movies_total }}</td>
            <td>{{ g.description|default:"—" }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="4">Жанры не добавлены.</td></tr>
    {% endfor %}
</table>
{% endblock %}
