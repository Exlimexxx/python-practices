{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h2>Вход в систему</h2>
<p>Введите учётные данные. Создание и редактирование данных доступно только администратору.</p>
{% if form.errors %}
    <p class="errorlist">Неверный логин или пароль.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Войти</button>
    <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
