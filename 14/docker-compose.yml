version: "3.9"

services:
  api:
    build: .
    container_name: movies-api
    ports:
      - "8014:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/movies
      REDIS_URL: redis://cache:6379/0
      CACHE_BACKEND: auto
    depends_on:
      - db
      - cache

  db:
    image: postgres:16-alpine
    container_name: movies-db
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:7-alpine
    container_name: movies-cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
