# docker-compose.yml — инфраструктура для лабораторной работы №13 (вариант 4).
# Запуск:  docker compose up -d
# Проверка: docker compose ps
services:

  mongodb:
    image: mongo:7
    container_name: lab13-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cinema
    ports:
      - "27017:27017"          # стандартный порт MongoDB
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lab13-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"            # стандартный порт Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
